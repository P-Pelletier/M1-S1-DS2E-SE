<!-- Small UX helpers: reading progress, back-to-top, copy buttons on code -->
<div id="read-progress"></div>
<button id="back-to-top" aria-label="Back to top" title="Back to top">↑</button>

<script>
(function () {
  var bar = document.getElementById('read-progress');
  var top = document.getElementById('back-to-top');

  function onScroll() {
    var h = document.documentElement;
    var max = h.scrollHeight - h.clientHeight;
    bar.style.width = (max > 0 ? (h.scrollTop / max) * 100 : 0) + '%';
    top.classList.toggle('show', h.scrollTop > 600);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  top.addEventListener('click', function () { window.scrollTo({ top: 0, behavior: 'smooth' }); });

  // Phones: the TOC is stacked above the title, so collapse it behind a button
  var toc = document.getElementById('TOC');
  if (toc) {
    var phone = window.matchMedia('(max-width: 767.98px)');
    var toggle = document.createElement('button');
    toggle.id = 'toc-toggle';
    toggle.type = 'button';
    toggle.textContent = 'Contents';
    toggle.setAttribute('aria-controls', 'TOC');
    toggle.setAttribute('aria-expanded', 'false');
    toc.parentNode.insertBefore(toggle, toc);
    toggle.addEventListener('click', function () {
      toggle.setAttribute('aria-expanded', toggle.getAttribute('aria-expanded') === 'true' ? 'false' : 'true');
    });
    // close it again once a section is picked
    toc.addEventListener('click', function (e) {
      if (phone.matches && e.target.closest('.tocify-item')) toggle.setAttribute('aria-expanded', 'false');
    });
  }

  // Copy button on source code blocks only (not on printed output)
  document.querySelectorAll('pre.sourceCode, pre.r, pre.python').forEach(function (pre) {
    var btn = document.createElement('button');
    btn.className = 'copy-btn';
    btn.type = 'button';
    btn.textContent = 'Copy';
    btn.addEventListener('click', function () {
      // collapse = TRUE merges output (## ...) into the block: strip it
      var text = pre.querySelector('code').innerText
        .split('\n').filter(function (l) { return !/^## /.test(l); }).join('\n');
      navigator.clipboard.writeText(text).then(function () {
        btn.textContent = 'Copied ✓';
        btn.classList.add('copied');
        setTimeout(function () { btn.textContent = 'Copy'; btn.classList.remove('copied'); }, 1500);
      });
    });
    pre.appendChild(btn);
  });
})();
</script>
